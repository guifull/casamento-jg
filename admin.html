<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Painel RSVP — Julia e Guilherme</title>
  <style>
    :root{--verde:#4b5442;--creme:#f4f1e8;--linha:#d8d3c4;--texto:#293025}*{box-sizing:border-box}body{margin:0;background:var(--creme);color:var(--texto);font-family:Georgia,serif}.shell{max-width:1180px;margin:auto;padding:32px 20px 60px}h1{font-weight:400;letter-spacing:.12em;margin:0 0 8px}.sub{color:#697064;margin-bottom:28px}.login{max-width:390px;margin:14vh auto;padding:32px;border:1px solid var(--linha);background:#fff}.login input{width:100%;padding:13px;border:1px solid var(--linha);font:inherit;margin:12px 0}.button{padding:12px 18px;border:0;background:var(--verde);color:#fff;cursor:pointer;font:inherit}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:20px}.toolbar input{min-width:280px;padding:11px;border:1px solid var(--linha);background:#fff}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}.metric{background:#fff;border:1px solid var(--linha);padding:18px}.metric strong{display:block;font-size:28px;font-weight:400}.metric span{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#6d7469}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--linha)}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #e6e2d8}th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;background:#ebe7dc}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:12px}.sim{background:#dce9e4;color:#31584c}.nao{background:#f0dfdc;color:#77483f}.pendente{background:#eee7d5;color:#745f30}.guest-primary{font-weight:bold}.empty{text-align:center;padding:40px;color:#777}.error{color:#8a3e35;margin-top:10px}.hidden{display:none}@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.toolbar input{min-width:100%}}
  </style>
</head>
<body><main class="shell">
  <section id="login" class="login"><h1>Painel RSVP</h1><p class="sub">Acesso restrito</p><form id="loginForm"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button class="button">Entrar</button><div id="loginError" class="error"></div></form></section>
  <section id="dashboard" class="hidden"><div class="toolbar"><div><h1>Confirmações</h1><div id="updated" class="sub"></div></div><button id="logout" class="button">Sair</button></div><div class="toolbar"><input id="search" type="search" placeholder="Buscar convite ou convidado"><button id="refresh" class="button">Atualizar</button></div><div id="cards" class="cards"></div><div class="table-wrap"><table><thead><tr><th>Convite</th><th>Pessoa</th><th>Tipo</th><th>Resposta</th><th>Última atualização</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script>
const login=document.querySelector('#login'),dashboard=document.querySelector('#dashboard'),rows=document.querySelector('#rows');let data=[];
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const status=value=>value===true?['Confirmado','sim']:value===false?['Não comparece','nao']:['Pendente','pendente'];
function render(){const term=document.querySelector('#search').value.toLocaleLowerCase('pt-BR');const filtered=data.filter(inv=>inv.name.toLocaleLowerCase('pt-BR').includes(term)||inv.guests.some(g=>g.name.toLocaleLowerCase('pt-BR').includes(term)));rows.innerHTML=filtered.flatMap(inv=>inv.guests.map(g=>{const [label,cls]=status(g.attending);return `<tr><td>${esc(inv.name)}</td><td class="${g.type==='primary'?'guest-primary':''}">${esc(g.name)}</td><td>${g.type==='primary'?'Titular':'Acompanhante'}</td><td><span class="pill ${cls}">${label}</span></td><td>${g.updatedAt?new Date(g.updatedAt).toLocaleString('pt-BR'):'—'}</td></tr>`})).join('')||'<tr><td colspan="5" class="empty">Nenhum resultado</td></tr>'}
async function load(){const response=await fetch('/api/admin/rsvps');if(response.status===401){login.classList.remove('hidden');dashboard.classList.add('hidden');return}const payload=await response.json();if(!response.ok)throw new Error(payload.message);data=payload.invitations;document.querySelector('#cards').innerHTML=[['Convites',payload.summary.invitations],['Pessoas',payload.summary.guests],['Confirmados',payload.summary.attending],['Não vão',payload.summary.declined],['Pendentes',payload.summary.pending]].map(([label,value])=>`<div class="metric"><strong>${value}</strong><span>${label}</span></div>`).join('');document.querySelector('#updated').textContent='Atualizado em '+new Date(payload.generatedAt).toLocaleString('pt-BR');login.classList.add('hidden');dashboard.classList.remove('hidden');render()}
document.querySelector('#loginForm').addEventListener('submit',async event=>{event.preventDefault();const response=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const payload=await response.json();if(!response.ok){document.querySelector('#loginError').textContent=payload.message;return}document.querySelector('#password').value='';await load()});
document.querySelector('#logout').addEventListener('click',async()=>{await fetch('/api/admin/logout',{method:'POST'});location.reload()});document.querySelector('#refresh').addEventListener('click',load);document.querySelector('#search').addEventListener('input',render);load().catch(error=>{document.querySelector('#loginError').textContent=error.message});
</script></body></html>

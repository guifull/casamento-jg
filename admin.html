<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Painel RSVP — Julia e Guilherme</title>
  <style>
    :root{--verde:#4b5442;--creme:#f4f1e8;--linha:#d8d3c4;--texto:#293025}*{box-sizing:border-box}body{margin:0;background:var(--creme);color:var(--texto);font-family:Georgia,serif}.shell{max-width:1280px;margin:auto;padding:32px 20px 60px}h1{font-weight:400;letter-spacing:.12em;margin:0 0 8px}.sub{color:#697064;margin-bottom:28px}.login{max-width:390px;margin:14vh auto;padding:32px;border:1px solid var(--linha);background:#fff}.login input,.dialog input{width:100%;padding:13px;border:1px solid var(--linha);font:inherit;margin:7px 0 14px}.button{padding:12px 18px;border:0;background:var(--verde);color:#fff;cursor:pointer;font:inherit}.button.secondary{background:#817f73}.button.danger{background:#8a3e35}.button.small{padding:7px 10px;font-size:13px}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:20px}.toolbar input{min-width:280px;padding:11px;border:1px solid var(--linha);background:#fff}.actions{display:flex;gap:8px}.row-actions{display:flex;gap:6px;align-items:center}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}.metric{background:#fff;border:1px solid var(--linha);padding:18px}.metric strong{display:block;font-size:28px;font-weight:400}.metric span{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#6d7469}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--linha)}table{border-collapse:collapse;width:100%;min-width:950px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #e6e2d8}th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;background:#ebe7dc}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:12px}.sim{background:#dce9e4;color:#31584c}.nao{background:#f0dfdc;color:#77483f}.pendente{background:#eee7d5;color:#745f30}.guest-primary{font-weight:bold}.empty{text-align:center;padding:40px;color:#777}.error{color:#8a3e35;margin-top:10px}.hidden{display:none}.dialog{border:1px solid var(--linha);padding:0;max-width:570px;width:calc(100% - 32px);background:var(--creme)}.dialog::backdrop{background:rgba(30,35,28,.55)}.dialog-body{padding:28px}.dialog h2{margin-top:0;font-weight:400}.guest-line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.toolbar input{min-width:100%}}
  </style>
</head>
<body><main class="shell">
  <section id="login" class="login"><h1>Painel RSVP</h1><p class="sub">Acesso restrito</p><form id="loginForm"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button class="button">Entrar</button><div id="loginError" class="error"></div></form></section>
  <section id="dashboard" class="hidden"><div class="toolbar"><div><h1>Confirmações</h1><div id="updated" class="sub"></div></div><button id="logout" class="button">Sair</button></div><div class="toolbar"><input id="search" type="search" placeholder="Buscar convite, pessoa ou telefone"><div class="actions"><button id="newInvitation" class="button">Novo convite</button><button id="refresh" class="button secondary">Atualizar</button></div></div><div id="cards" class="cards"></div><div class="table-wrap"><table><thead><tr><th>Convite</th><th>Telefone</th><th>Pessoa</th><th>Tipo</th><th>Resposta</th><th>Última atualização</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
  <dialog id="editor" class="dialog"><form id="editorForm" class="dialog-body"><h2 id="editorTitle">Novo convite</h2><input id="invitationId" type="hidden"><label for="displayName">Nome do convite</label><input id="displayName" required><label for="phone">Telefone com DDD</label><input id="phone" inputmode="tel" required><label>Pessoas do convite</label><div id="guestFields"></div><button id="addGuest" type="button" class="button small">Adicionar acompanhante</button><div id="editorError" class="error"></div><div class="dialog-actions"><button id="cancelEditor" type="button" class="button secondary">Cancelar</button><button class="button">Salvar</button></div></form></dialog>
</main><script>
const login=document.querySelector('#login'),dashboard=document.querySelector('#dashboard'),rows=document.querySelector('#rows');let data=[];
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const status=value=>value===true?['Confirmado','sim']:value===false?['Não comparece','nao']:['Pendente','pendente'];
function formatPhone(value){if(!value)return '—';if(value.length===11)return `(${value.slice(0,2)}) ${value.slice(2,7)}-${value.slice(7)}`;return value}
function render(){const term=document.querySelector('#search').value.toLocaleLowerCase('pt-BR');const filtered=data.filter(inv=>inv.name.toLocaleLowerCase('pt-BR').includes(term)||(inv.phone||'').includes(term.replace(/\D/g,''))||inv.guests.some(g=>g.name.toLocaleLowerCase('pt-BR').includes(term)));rows.innerHTML=filtered.flatMap(inv=>inv.guests.map((g,index)=>{const [label,cls]=status(g.attending);return `<tr><td>${esc(inv.name)}</td><td>${index===0?esc(formatPhone(inv.phone)):''}</td><td class="${g.type==='primary'?'guest-primary':''}">${esc(g.name)}</td><td>${g.type==='primary'?'Titular':'Acompanhante'}</td><td><span class="pill ${cls}">${label}</span></td><td>${g.updatedAt?new Date(g.updatedAt).toLocaleString('pt-BR'):'—'}</td><td><div class="row-actions">${index===0?`<button class="button small edit" data-id="${inv.id}">Editar</button>`:''}<button class="button small danger delete-guest" data-invitation-id="${inv.id}" data-guest-id="${g.id}">Excluir</button></div></td></tr>`})).join('')||'<tr><td colspan="7" class="empty">Nenhum resultado</td></tr>';document.querySelectorAll('.edit').forEach(button=>button.addEventListener('click',()=>openEditor(data.find(inv=>inv.id===button.dataset.id))));document.querySelectorAll('.delete-guest').forEach(button=>button.addEventListener('click',()=>deleteGuest(button.dataset.invitationId,button.dataset.guestId)))}
async function load(){const response=await fetch('/api/admin/rsvps');if(response.status===401){login.classList.remove('hidden');dashboard.classList.add('hidden');return}const payload=await response.json();if(!response.ok)throw new Error(payload.message);data=payload.invitations;document.querySelector('#cards').innerHTML=[['Convites',payload.summary.invitations],['Pessoas',payload.summary.guests],['Confirmados',payload.summary.attending],['Não vão',payload.summary.declined],['Pendentes',payload.summary.pending]].map(([label,value])=>`<div class="metric"><strong>${value}</strong><span>${label}</span></div>`).join('');document.querySelector('#updated').textContent='Atualizado em '+new Date(payload.generatedAt).toLocaleString('pt-BR');login.classList.add('hidden');dashboard.classList.remove('hidden');render()}
document.querySelector('#loginForm').addEventListener('submit',async event=>{event.preventDefault();const response=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const payload=await response.json();if(!response.ok){document.querySelector('#loginError').textContent=payload.message;return}document.querySelector('#password').value='';await load()});
document.querySelector('#logout').addEventListener('click',async()=>{await fetch('/api/admin/logout',{method:'POST'});location.reload()});document.querySelector('#refresh').addEventListener('click',load);document.querySelector('#search').addEventListener('input',render);load().catch(error=>{document.querySelector('#loginError').textContent=error.message});
const editor=document.querySelector('#editor'),guestFields=document.querySelector('#guestFields');
function guestField(guest={},index=0){const row=document.createElement('div');row.className='guest-line';row.dataset.id=guest.id||'';row.innerHTML=`<input value="${esc(guest.name||'')}" placeholder="${index===0?'Nome do titular':'Nome do acompanhante'}" required><button type="button" class="button small danger remove" ${index===0?'disabled':''}>Excluir</button>`;row.querySelector('.remove').addEventListener('click',()=>{if(!row.dataset.id||confirm(`Excluir ${row.querySelector('input').value} deste convite? A exclusão será concluída ao clicar em Salvar.`))row.remove()});guestFields.appendChild(row)}
function openEditor(invitation=null){document.querySelector('#editorTitle').textContent=invitation?'Editar convite':'Novo convite';document.querySelector('#invitationId').value=invitation?.id||'';document.querySelector('#displayName').value=invitation?.name||'';document.querySelector('#phone').value=invitation?.phone||'';document.querySelector('#editorError').textContent='';guestFields.innerHTML='';(invitation?.guests||[{}]).forEach(guest=>guestField(guest,guestFields.children.length));editor.showModal()}
document.querySelector('#newInvitation').addEventListener('click',()=>openEditor());document.querySelector('#addGuest').addEventListener('click',()=>guestField({},guestFields.children.length));document.querySelector('#cancelEditor').addEventListener('click',()=>editor.close());
async function deleteGuest(invitationId,guestId){const invitation=data.find(inv=>inv.id===invitationId),guest=invitation?.guests.find(item=>item.id===guestId);if(!invitation||!guest)return;const remaining=invitation.guests.filter(item=>item.id!==guestId),deletingInvitation=remaining.length===0,newPrimary=guest.type==='primary'&&remaining[0];const warning=deletingInvitation?`Excluir ${guest.name}? Como é a única pessoa, o convite e o telefone também serão apagados.`:newPrimary?`Excluir o titular ${guest.name}? ${newPrimary.name} passará a ser o novo titular deste convite.`:`Excluir ${guest.name} deste convite? Esta ação retirará a pessoa do RSVP.`;if(!confirm(warning))return;const response=deletingInvitation?await fetch('/api/admin/delete-invitation',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:invitation.id})}):await fetch('/api/admin/save-invitation',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:invitation.id,displayName:newPrimary?newPrimary.name:invitation.name,phone:invitation.phone,guests:remaining.map(item=>({id:item.id,name:item.name}))})});const result=await response.json();if(!response.ok){alert(result.message||'Não foi possível concluir a exclusão.');return}await load()}
document.querySelector('#editorForm').addEventListener('submit',async event=>{event.preventDefault();const id=document.querySelector('#invitationId').value;const payload={id:id||null,displayName:document.querySelector('#displayName').value,phone:document.querySelector('#phone').value,guests:[...guestFields.children].map(row=>({id:row.dataset.id,name:row.querySelector('input').value}))};const response=await fetch('/api/admin/save-invitation',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok){document.querySelector('#editorError').textContent=result.message;return}editor.close();await load()});
</script></body></html>
